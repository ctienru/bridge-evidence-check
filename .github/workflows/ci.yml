name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict
      - run: uv run pytest -q
      - run: uv run pip-audit
        continue-on-error: true  # transitive CVEs can turn red at random; reported, not blocking

  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # later: compare splits.yaml against the PR base
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run python scripts/freeze_splits.py --check
