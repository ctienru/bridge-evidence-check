# Frozen copy of guide W-01 (docs/annotation-guide.md §8): the deterministic keyword scan
# lists every sentence containing one of these terms that no candidate quote covers.
# Matching is case-insensitive; word-boundary for alphanumeric terms, plain substring for
# terms containing other characters ("GLP-1", "A1c", "Part D"). Every `names:` entry of the
# file named in `include_drug_names_from` is scanned as well. A change here follows a
# change to W-01 and bumps `version`.
version: scan-terms-v1
include_drug_names_from: rules/drugs-v2.yaml
terms:
