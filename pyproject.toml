[project]
name = "bridge-check"
version = "0.0.1"
description = "Pre-attestation chart evidence checker for the Medicare GLP-1 Bridge: the LLM extracts, deterministic code decides."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
bridge = "bridge_check.cli:main"

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pytest",
    "ruff",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_check"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Anthropic API; needs ANTHROPIC_API_KEY",
    "slow: slow tests (property tests); skipped by the Stop hook",
]
