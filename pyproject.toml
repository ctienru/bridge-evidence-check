[project]
name = "bridge-check"
version = "0.0.1"
description = "Pre-attestation chart evidence checker for the Medicare GLP-1 Bridge: the LLM extracts, deterministic code decides."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
bridge = "bridge_check.cli:main"

[dependency-groups]
dev = [
    "hypothesis",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pytest",
    "ruff",
    "types-PyYAML",
]
# Data-line tools only (scripts/draft_authored.py, scripts/propose_candidates.py);
# never a runtime dependency of the pipeline.
data = [
    "openai",
]
# Evaluation shell only (`tests/eval/`, the CI `eval` job); the scoring itself is
# deterministic code in `bridge_check.scoring` and needs none of this.
eval = [
    "deepeval==4.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_check"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# `openai` is in the optional `data` group and imported lazily; CI type-checks without it.
module = ["openai", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `deepeval` is in the optional `eval` group and ships no type information; `tests/eval`
# skips without it. Treated as `Any` whether or not it is installed, so mypy gives the same
# answer in the `quality` job (no eval group) and in a full local environment.
module = ["deepeval", "deepeval.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio arrives with the `eval` group; silence its default-scope warning
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls the real Anthropic API; needs ANTHROPIC_API_KEY",
    "slow: slow tests (property tests); skipped by the Stop hook",
    "network: downloads the MTSamples mirror",
]
